name: Size Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Check android folder
        run: |
          if [ ! -d android ]; then
            echo "::error::شغّل Bootstrap Android أولاً."
            exit 1
          fi

      - run: flutter pub get

      - name: Build release APKs (split per ABI)
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Report sizes
        run: |
          echo "## أحجام APK (release)" >> "$GITHUB_STEP_SUMMARY"
          ls -l build/app/outputs/flutter-apk/*-release.apk | awk '{printf "- %s: %.1f MB\n", $9, $5/1048576}' >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: open-gate-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7
