name: Bootstrap Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Generate android scaffold
        run: |
          if [ -d android ]; then
            echo "مجلد android موجود مسبقاً، لا شيء لفعله."
            exit 0
          fi

          # --project-name app مع --org com.opengate يعطي applicationId = com.opengate.app
          flutter create /tmp/gen --org com.opengate --project-name app --platforms android --no-pub
          cp -r /tmp/gen/android ./android

          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="app"/android:label="Open Gate"/' "$MANIFEST"
          sed -i '0,/<manifest[^>]*>/s//&\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"

          grep -q 'android.permission.INTERNET' "$MANIFEST" || { echo "::error::فشلت إضافة صلاحية INTERNET"; exit 1; }
          grep -q 'Open Gate' "$MANIFEST" || { echo "::error::فشل ضبط اسم التطبيق"; exit 1; }
          grep -rq 'com.opengate.app' android/app/build.gradle* || { echo "::error::معرّف الحزمة لم يُضبط كما هو متوقع"; exit 1; }

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          git diff --cached --quiet && { echo "لا تغييرات"; exit 0; }
          git commit -m "chore: add android scaffold (com.opengate.app)"
          git push
