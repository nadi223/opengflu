name: Generate Icon

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check android folder
        run: |
          if [ ! -d android ]; then
            echo "::error::شغّل Bootstrap Android أولاً."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow
      - run: python tools/make_icon.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res assets/icon
          git diff --cached --quiet && { echo "لا تغييرات"; exit 0; }
          git commit -m "chore: app icon"
          git push
