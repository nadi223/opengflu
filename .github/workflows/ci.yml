name: CI

on:
push:
pull_request:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: ci-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 45
steps:
- uses: actions/checkout@v4

- uses: actions/setup-java@v4
with:
distribution: temurin
java-version: '17'

- uses: subosito/flutter-action@v2
with:
channel: stable
flutter-version: '3.47.1'
cache: true

- name: Check android folder
run: |
if [ ! -d android ]; then
	echo "::error::مجلد android غير موجود. شغّل workflow باسم 'Bootstrap Android' من تبويب Actions أولاً."
	exit 1
	fi
	
	- name: Versions
	run: flutter --version
	
	- name: Pub get
	run: flutter pub get
	
	- name: Format check
	run: |
	dart format --output=none --set-exit-if-changed . || {
		echo "::error::التنسيق غير مطابق. شغّل workflow باسم 'Format' من تبويب Actions ليصلحه تلقائياً."
		exit 1
	}
	
	# --no-fatal-infos: الملاحظات الإرشادية لا تفشل البناء، أما الأخطاء والتحذيرات فتفشله.
	- name: Analyze
	run: flutter analyze --no-fatal-infos
	
	- name: Test
	run: flutter test
	
	- name: Build debug APK
	run: >
	flutter build apk --debug
	--dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
	--dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
	
	- name: Upload debug APK
	uses: actions/upload-artifact@v4
	with:
	name: open-gate-debug-apk
	path: build/app/outputs/flutter-apk/app-debug.apk
	retention-days: 90
