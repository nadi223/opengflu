name: open_gate
description: Open Gate - سوق اليمن (عام، عقارات، سيارات، مزادات)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.4.1
  supabase_flutter: ^2.17.2
  # النطاقات الواسعة أدناه مقصودة: لم أتحقق من أحدث إصدار لهذه الحزم،
  # وسيثبّت pub أحدث إصدار متوافق في pubspec.lock عند أول بناء.
  go_router: ">=14.0.0 <20.0.0"
  shared_preferences: ">=2.3.0 <4.0.0"
  connectivity_plus: ">=6.0.0 <9.0.0"
  cached_network_image: ">=3.3.0 <5.0.0"
  url_launcher: ">=6.2.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <8.0.0"

flutter:
  uses-material-design: true
  # الخطوط: ضع ملفات Cairo في assets/fonts ثم فعّل هذا القسم (انظر README).
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
